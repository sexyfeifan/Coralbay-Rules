name: Docker

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify release
        run: |
          go test -race ./...
          go vet ./...
          bash -n install.sh
          sh -n sync.sh
          bash tests/install_test.sh
          bash tests/sync_test.sh
          node --check web/app.js
          node --check web/login.js
          node --check web/routing.js
          node --check web/miaomiaowu.js
          node --check web/miaomiaowu-rules.js
          node tests/source_ui_test.cjs
          node tests/miaomiaowu_ui_test.cjs
          node tests/miaomiaowu_rules_ui_test.cjs
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(awk -F= '/^ARG VERSION=/{print $2; exit}' Dockerfile)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match Dockerfile version'; exit 1; }
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check registry publishing configuration
        id: registry
        shell: bash
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Docker Hub credentials are not configured. This run verifies both architectures without publishing; release images must be published by an authenticated maintainer.'
          fi
      - uses: docker/login-action@v3
        if: steps.registry.outputs.publish == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: sexyfeifan/coralbay-rules
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.registry.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
