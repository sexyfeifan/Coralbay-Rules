<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoralBay Rules 控制台</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main>
<header><div><h1>CoralBay Rules</h1><div class="muted">免登录运维控制台</div></div><a class="button secondary" href="/">公开首页</a></header>
<div class="grid">
<section class="card"><div class="muted">运行状态</div><div id="adminState" class="value">读取中</div><small id="adminCommit" class="muted">—</small></section>
<section class="card"><div class="muted">程序版本</div><div id="runningVersion" class="value">—</div><small id="latestVersion" class="muted">—</small></section>
<section class="card"><div class="muted">HTTPS 证书</div><div id="certificate" class="value">—</div><small id="certificateIssuer" class="muted">—</small></section>
<section class="card"><div class="muted">图标缓存</div><div id="iconCache" class="value">—</div><small id="iconBytes" class="muted">—</small></section>
<section class="card clickable" id="ruleCard"><div class="muted">已校验规则</div><div id="adminFiles" class="value">—</div><small class="muted">点击查看链接与详情</small></section>
<section class="card"><div class="muted">可用存储</div><div id="diskFree" class="value">—</div><small class="muted">规则数据卷剩余空间</small></section>
</div>
<section class="card section"><h2>运行与更新</h2><div class="toolbar"><button id="sync">立即同步规则</button><button id="updateApp">检查并升级 Docker</button><button id="copyTemplate" class="secondary">复制 PPanel 模板链接</button><a class="button secondary" href="/downloads/CoralBay_OpenClash_PPanel_Template.yaml">下载 PPanel 模板（YAML）</a><button id="refresh" class="secondary">刷新诊断</button></div><div id="message" class="muted"></div></section>
<section class="card section"><h2>同步频率</h2><div class="settings-row"><select id="interval"><option value="3600">每 1 小时</option><option value="21600">每 6 小时</option><option value="43200">每 12 小时</option><option value="86400">每 24 小时</option><option value="604800">每 7 天</option></select><button id="saveInterval">保存设置</button><span id="intervalHint" class="muted"></span></div></section>
<section id="ruleSection" class="card section"><h2>规则资源</h2><p class="muted">MRS 为编译后的二进制规则集；可检查元数据、原始地址和镜像地址，但不能按文本展开内部条目。</p><div class="table-wrap"><table><thead><tr><th>规则</th><th>类型</th><th>缓存</th><th>大小</th><th>地址与详情</th></tr></thead><tbody id="ruleRows"><tr><td colspan="5">加载中</td></tr></tbody></table></div></section>
<div class="grid section"><section class="card"><h2>历史版本</h2><div id="releases" class="muted">加载中</div></section><section class="card"><h2>运行日志</h2><pre id="logs">加载中</pre></section></div>
</main><script src="/assets/app.js"></script></body></html>
