<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoralBay Rules 管理</title><link rel="stylesheet" href="/assets/style.css"></head><body><main><section id="login" class="card login"><h1>管理后台</h1><p class="muted">请输入安装时设置的管理员密码</p><input id="password" type="password" autocomplete="current-password" placeholder="管理员密码"><button id="loginBtn">登录</button><p id="loginError" class="bad"></p></section><div id="dashboard" class="hidden"><header><div><h1>CoralBay Rules</h1><div class="muted">Web 管理后台</div></div><button id="logout" class="secondary">退出登录</button></header><div class="grid"><section class="card"><div class="muted">服务状态</div><div id="adminState" class="value">—</div></section><section class="card"><div class="muted">当前提交</div><div id="adminCommit" class="value">—</div></section><section class="card"><div class="muted">规则校验</div><div id="adminFiles" class="value">—</div></section><section class="card"><div class="muted">同步周期</div><div id="adminInterval" class="value">—</div></section></div><section class="card" style="margin-top:16px"><h2>日常操作</h2><div class="toolbar"><button id="sync">立即同步</button><button id="copyTemplate" class="secondary">复制 PPanel 模板链接</button><a class="button secondary" href="/_templates/ppanel_openclash_pro_cn.gotmpl" download>下载模板</a><button id="refresh" class="secondary">刷新状态</button></div><div id="message" class="muted"></div></section><div class="grid" style="margin-top:16px"><section class="card"><h2>历史版本</h2><div id="releases" class="muted">加载中</div></section><section class="card"><h2>运行日志</h2><pre id="logs">加载中</pre></section></div></div></main><script src="/assets/app.js"></script></body></html>
