# CoralBay Rules 本地化 MihomoPro 覆写模板
[General]
DISABLE_UDP_QUIC = 1

# 每周一凌晨 6 点从 CoralBay 本机规则镜像更新完整配置。
# 上游 666OS 原始文件已作为构建快照随镜像分发；同步成功后会生成本地域名版本。
DOWNLOAD_FILE = url=__MIHOMOPRO_CONFIG_URL__, path=/etc/openclash/config/MihomoPro.yaml, cron=0 6 * * 1, force=false

CONFIG_FILE = /etc/openclash/config/MihomoPro.yaml
SUB_INFO_URL = $EN_KEY1

[Overwrite]
# EN_KEY1 / EN_KEY2 分别填写主、备用订阅 URL。
# 两项均可留空；只建立实际填写的完整 provider，不保留已清空的旧订阅。
# URL 作为 Ruby 的参数传入并用 inspect 编码，不能拼入待执行的 Ruby 源码。
CB_PROVIDERS="$(ruby -e 'h={}; tag=File.basename(ARGV.shift, ".yaml").gsub(/[^a-zA-Z0-9_.-]/, "_")[0,120]; ARGV.each_with_index{|raw,i| u=raw.to_s.strip; next if u.empty?; abort "CoralBay: 订阅 URL 无效" unless u.match(%r{\Ahttps?://[^/?#[:space:]]+(?:[/?#].*)?\z}) && !u.match(/[[:cntrl:][:space:]]/); h[["优质服务商","备用服务商"][i]]={"type"=>"http","url"=>u,"path"=>"./proxy_provider/coralbay-mihomopro-#{tag}-#{i}.yaml","interval"=>86400,"health-check"=>{"enable"=>true,"url"=>"https://www.gstatic.com/generate_204","interval"=>300}}}; puts h.inspect' "$CONFIG_FILE" "${EN_KEY1:-}" "${EN_KEY2:-}")" || exit 1
ruby_edit "$CONFIG_FILE" "['proxy-providers']" "(Value['proxy-providers'] || {}).reject{|k,v| ['优质服务商','备用服务商'].include?(k)}.merge(($CB_PROVIDERS).transform_values{|provider| (Value['x-base-provider'] || {}).merge(provider)})"
